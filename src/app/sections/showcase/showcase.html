<section id="coleccion" class="showcase">
  <div class="container showcase__inner">
    <div class="showcase__copy">
      <span class="eyebrow">El cuadro</span>
      <h2 class="showcase__title">Tu medalla.<br />Tu ruta.<br />Tus tiempos.</h2>
      <p class="showcase__lead muted">
        Cada pieza reúne lo que viviste en la competencia y lo deja listo para colgar en la pared.
      </p>
      <dl class="features">
        @for (feature of features; track feature.name) {
          <div class="features__row">
            <dt>{{ feature.name }}</dt>
            <dd class="muted">{{ feature.detail }}</dd>
          </div>
        }
      </dl>
    </div>

    <div class="showcase__art">
      <svg
        viewBox="0 0 600 440"
        role="img"
        aria-label="Ilustración del cuadro: medalla arriba, mapa en relieve con la ruta al centro y los tiempos abajo"
      >
        <defs>
          <clipPath id="mapclip"><rect x="40" y="92" width="520" height="248" /></clipPath>
        </defs>
        <rect x="2" y="2" width="596" height="436" fill="#ffffff" stroke="#000000" stroke-width="4" />
        <circle cx="300" cy="46" r="24" fill="#ffffff" stroke="#000000" stroke-width="3" />
        <circle cx="300" cy="46" r="12" fill="#000000" />
        <rect x="40" y="92" width="520" height="248" fill="#000000" />
        <g clip-path="url(#mapclip)" fill="none" stroke="#ffffff" stroke-width="0.9">
          @for (hill of hills; track hill.cx) {
            <g [attr.transform]="'rotate(' + hill.rotate + ' ' + hill.cx + ' ' + hill.cy + ')'">
              @for (ring of hill.rings; track $index) {
                <ellipse [attr.cx]="hill.cx" [attr.cy]="hill.cy" [attr.rx]="ring[0]" [attr.ry]="ring[1]" />
              }
            </g>
          }
        </g>
        <path
          d="M72 308 C 118 262, 148 292, 190 240 S 262 178, 312 206 S 398 276, 452 196 S 504 138, 530 152"
          fill="none"
          stroke="#ffffff"
          stroke-width="6"
          stroke-linecap="round"
          stroke-linejoin="round"
          clip-path="url(#mapclip)"
        />
        <g font-family="Montserrat, system-ui, sans-serif" fill="#000000" text-anchor="middle">
          @for (split of splits; track split.label) {
            <text [attr.x]="split.x" y="372" font-size="11" font-weight="500" letter-spacing="2.4">{{ split.label }}</text>
            <text [attr.x]="split.x" y="402" font-size="20" font-weight="300">{{ split.time }}</text>
          }
        </g>
      </svg>
    </div>
  </div>
</section>
