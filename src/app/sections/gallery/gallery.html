<section class="gallery">
  <div class="container gallery__inner">
    <div class="gallery__head">
      <h2 class="gallery__title">Recuerdos hechos<br />para cada deporte.</h2>
      <p class="gallery__lead muted">
        Triatlón, maratón, ciclismo, trail: si tiene ruta y meta, se puede convertir en un cuadro.
      </p>
    </div>
    <div class="gallery__grid">
      @for (photo of photos; track $index) {
        <figure class="gallery__item">
          @if (photo.src) {
            <img [src]="photo.src" [alt]="photo.alt" />
          } @else {
            <span>[Foto del trabajo]</span>
          }
        </figure>
      }
    </div>
  </div>
</section>
